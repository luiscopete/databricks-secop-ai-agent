[project]
name = "secop-ai-agent"
version = "0.1.0"
description = "SECOP AI agent running on Databricks Apps"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "databricks-openai>=0.13.0",
    "databricks-agents>=1.9.3",
    "databricks-sdk>=0.69.0",
    "mlflow>=3.10.0",
    "openai-agents>=0.4.1",
    "python-dotenv>=1.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]

[build-system]
requires = ["hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "scripts"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
preflight = "scripts.preflight:main"
