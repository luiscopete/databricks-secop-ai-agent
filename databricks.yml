bundle:
  name: secop_ai

variables:
  experiment_id:
    description: "Existing MLflow experiment ID used for agent traces"
  catalog:
    description: "Unity Catalog catalog containing the SECOP tools"
    default: "secop_ai"
  tools_schema:
    description: "Unity Catalog schema containing the SECOP UC functions"
    default: "ai_agents_tools"
  gold_schema:
    description: "Unity Catalog schema containing the SECOP Gold tables"
    default: "gold"
  sql_warehouse_id:
    description: "Existing Databricks SQL Warehouse ID used to deploy UC functions"
  model_endpoint:
    description: "Databricks Foundation Model endpoint used by the agent"
    default: "databricks-meta-llama-3-3-70b-instruct"

resources:
  jobs:
    deploy_uc_tools:
      name: "${bundle.target}-secop-ai-deploy-uc-tools"
      tasks:
        - task_key: "create_schema"
          sql_task:
            file:
              path: "${workspace.file_path}/uc_tools/sql/00_create_schema.sql"
              source: "WORKSPACE"
            warehouse_id: "${var.sql_warehouse_id}"
            parameters:
              catalog: "${var.catalog}"
              tools_schema: "${var.tools_schema}"
              gold_schema: "${var.gold_schema}"

        - task_key: "deploy_contracts_by_budget"
          depends_on:
            - task_key: "create_schema"
          sql_task:
            file:
              path: "${workspace.file_path}/uc_tools/sql/01_contracts_by_budget.sql"
              source: "WORKSPACE"
            warehouse_id: "${var.sql_warehouse_id}"
            parameters:
              catalog: "${var.catalog}"
              tools_schema: "${var.tools_schema}"
              gold_schema: "${var.gold_schema}"

        - task_key: "deploy_contracts_by_location"
          depends_on:
            - task_key: "deploy_contracts_by_budget"
          sql_task:
            file:
              path: "${workspace.file_path}/uc_tools/sql/02_contracts_by_location.sql"
              source: "WORKSPACE"
            warehouse_id: "${var.sql_warehouse_id}"
            parameters:
              catalog: "${var.catalog}"
              tools_schema: "${var.tools_schema}"
              gold_schema: "${var.gold_schema}"

        - task_key: "deploy_contracts_by_type"
          depends_on:
            - task_key: "deploy_contracts_by_location"
          sql_task:
            file:
              path: "${workspace.file_path}/uc_tools/sql/03_contracts_by_type.sql"
              source: "WORKSPACE"
            warehouse_id: "${var.sql_warehouse_id}"
            parameters:
              catalog: "${var.catalog}"
              tools_schema: "${var.tools_schema}"
              gold_schema: "${var.gold_schema}"

        - task_key: "deploy_summary_by_department"
          depends_on:
            - task_key: "deploy_contracts_by_type"
          sql_task:
            file:
              path: "${workspace.file_path}/uc_tools/sql/04_summary_by_department.sql"
              source: "WORKSPACE"
            warehouse_id: "${var.sql_warehouse_id}"
            parameters:
              catalog: "${var.catalog}"
              tools_schema: "${var.tools_schema}"
              gold_schema: "${var.gold_schema}"

        - task_key: "deploy_contracts_by_entity"
          depends_on:
            - task_key: "deploy_summary_by_department"
          sql_task:
            file:
              path: "${workspace.file_path}/uc_tools/sql/05_contracts_by_entity.sql"
              source: "WORKSPACE"
            warehouse_id: "${var.sql_warehouse_id}"
            parameters:
              catalog: "${var.catalog}"
              tools_schema: "${var.tools_schema}"
              gold_schema: "${var.gold_schema}"

        - task_key: "deploy_high_value_contracts"
          depends_on:
            - task_key: "deploy_contracts_by_entity"
          sql_task:
            file:
              path: "${workspace.file_path}/uc_tools/sql/06_high_value_contracts.sql"
              source: "WORKSPACE"
            warehouse_id: "${var.sql_warehouse_id}"
            parameters:
              catalog: "${var.catalog}"
              tools_schema: "${var.tools_schema}"
              gold_schema: "${var.gold_schema}"

        - task_key: "deploy_format_contract_info"
          depends_on:
            - task_key: "deploy_high_value_contracts"
          sql_task:
            file:
              path: "${workspace.file_path}/uc_tools/sql/07_format_contract_info.sql"
              source: "WORKSPACE"
            warehouse_id: "${var.sql_warehouse_id}"
            parameters:
              catalog: "${var.catalog}"
              tools_schema: "${var.tools_schema}"
              gold_schema: "${var.gold_schema}"

        - task_key: "deploy_recent_contracts"
          depends_on:
            - task_key: "deploy_format_contract_info"
          sql_task:
            file:
              path: "${workspace.file_path}/uc_tools/sql/08_recent_contracts.sql"
              source: "WORKSPACE"
            warehouse_id: "${var.sql_warehouse_id}"
            parameters:
              catalog: "${var.catalog}"
              tools_schema: "${var.tools_schema}"
              gold_schema: "${var.gold_schema}"

  apps:
    secop_ai:
      name: "agent-secop-ai"
      description: "SECOP AI assistant"
      source_code_path: ./

      resources:
        - name: "experiment"
          experiment:
            experiment_id: ${var.experiment_id}
            permission: "CAN_MANAGE"

        - name: "trace_annotations"
          uc_securable:
            securable_full_name: "${var.catalog}.observability.${var.experiment_id}_otel_annotations"
            securable_type: "TABLE"
            permission: "MODIFY"

        - name: "trace_logs"
          uc_securable:
            securable_full_name: "${var.catalog}.observability.${var.experiment_id}_otel_logs"
            securable_type: "TABLE"
            permission: "MODIFY"

        - name: "trace_metrics"
          uc_securable:
            securable_full_name: "${var.catalog}.observability.${var.experiment_id}_otel_metrics"
            securable_type: "TABLE"
            permission: "MODIFY"

        - name: "trace_spans"
          uc_securable:
            securable_full_name: "${var.catalog}.observability.${var.experiment_id}_otel_spans"
            securable_type: "TABLE"
            permission: "MODIFY"

        - name: "llm"
          serving_endpoint:
            name: ${var.model_endpoint}
            permission: "CAN_QUERY"

        - name: "search_contracts"
          uc_securable:
            securable_full_name: ${var.catalog}.${var.tools_schema}.search_contracts
            securable_type: "FUNCTION"
            permission: "EXECUTE"

        - name: "contracts_by_budget"
          uc_securable:
            securable_full_name: ${var.catalog}.${var.tools_schema}.contracts_by_budget
            securable_type: "FUNCTION"
            permission: "EXECUTE"

        - name: "contracts_by_entity"
          uc_securable:
            securable_full_name: ${var.catalog}.${var.tools_schema}.contracts_by_entity
            securable_type: "FUNCTION"
            permission: "EXECUTE"

        - name: "contracts_by_location"
          uc_securable:
            securable_full_name: ${var.catalog}.${var.tools_schema}.contracts_by_location
            securable_type: "FUNCTION"
            permission: "EXECUTE"

        - name: "contracts_by_type"
          uc_securable:
            securable_full_name: ${var.catalog}.${var.tools_schema}.contracts_by_type
            securable_type: "FUNCTION"
            permission: "EXECUTE"

        - name: "high_value_contracts"
          uc_securable:
            securable_full_name: ${var.catalog}.${var.tools_schema}.high_value_contracts
            securable_type: "FUNCTION"
            permission: "EXECUTE"

        - name: "recent_contracts"
          uc_securable:
            securable_full_name: ${var.catalog}.${var.tools_schema}.recent_contracts
            securable_type: "FUNCTION"
            permission: "EXECUTE"

        - name: "summary_by_department"
          uc_securable:
            securable_full_name: ${var.catalog}.${var.tools_schema}.summary_by_department
            securable_type: "FUNCTION"
            permission: "EXECUTE"

        - name: "fetch_contract_files"
          uc_securable:
            securable_full_name: ${var.catalog}.${var.tools_schema}.fetch_contract_files
            securable_type: "FUNCTION"
            permission: "EXECUTE"

        - name: "format_contract_info"
          uc_securable:
            securable_full_name: ${var.catalog}.${var.tools_schema}.format_contract_info
            securable_type: "FUNCTION"
            permission: "EXECUTE"

targets:
  dev:
    mode: development
    default: true

    variables:
      experiment_id: "33832617697274"
      model_endpoint: "databricks-meta-llama-3-3-70b-instruct"

  prod:
    mode: production
    resources:
      apps:
        secop_ai:
          name: "agent-secop-ai"
